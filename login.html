<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naari Saree Manager — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
  <div class="login-card">
    <h1 class="login-title">Naari</h1>
    <p class="login-subtitle">Saree Shopify Manager</p>
    <form id="login-form">
      <label class="field-label" for="password">App password</label>
      <div class="password-wrapper">
        <input type="password" id="password" class="field-input password-input" autocomplete="current-password" required
          placeholder="Enter password">
        <button type="button" id="toggle-password-btn" class="toggle-password-eye-btn"
          aria-label="Toggle password visibility">
          <svg class="eye-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path class="eye-open" d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
            <circle class="eye-open" cx="12" cy="12" r="3"></circle>
            <line class="eye-closed hidden" x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn primary-btn full-width">Sign in</button>
    </form>
    <p id="login-error" class="error-text hidden"></p>
  </div>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>

</html>
